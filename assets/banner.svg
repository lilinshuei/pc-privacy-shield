  </g>
  <text x="64" y="104" fill="#ffffff" fill-opacity="0.62" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" letter-spacing="4">DEEPSEEK HARNESS · SKILL</text>
  <text x="64" y="164" fill="#ffffff" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="46" font-weight="700">pc-privacy-shield</text>
  <text x="64" y="210" fill="#ffffff" fill-opacity="0.92" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="24">你的屏幕看得见，别人的截屏看不见</text>
  <text x="64" y="250" fill="#ffffff" fill-opacity="0.55" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16">截屏、录屏、远控、屏幕共享时，让敏感窗口自动变黑；本机照常查看和编辑。</text>
