      <stop offset="0" stop-color="#07130f"/>
      <stop offset="1" stop-color="#16c784"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.16">
    <circle cx="1010" cy="70" r="120"/>
    <circle cx="1010" cy="70" r="168"/>
    <circle cx="1010" cy="70" r="216"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.9">
